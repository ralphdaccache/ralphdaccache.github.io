<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music — Ralph Daccache</title>
    <meta name="description" content="Music by Ralph Daccache" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="256x256" type="image/x-icon" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .cover,
      .cover-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover {
        z-index: 0;
      }
      .cover-overlay {
        z-index: 1;
        opacity: 0;
        pointer-events: none;
        transition: opacity 700ms ease;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 2;
        pointer-events: none;
      }
      .track-list {
        position: absolute;
        top: 50%;
        left: 32px;
        transform: translateY(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .track-item {
        cursor: pointer;
        transition: transform 500ms ease, opacity 500ms ease;
        transform-origin: left center;
      }
      .track-item.active {
        opacity: 1;
        transform: scale(1);
      }
      .track-item.inactive {
        opacity: 0.4;
        transform: scale(0.95);
      }
      .track-title {
        font-weight: 700;
        letter-spacing: 0.025em;
        transition: font-size 300ms ease, color 300ms ease;
        margin: 0;
      }
      .track-item.active .track-title {
        font-size: 20px;
        color: #fff;
      }
      .track-item.inactive .track-title {
        font-size: 18px;
        color: #9ca3af;
      }
      .track-role {
        font-weight: 300;
        transition: font-size 300ms ease, color 300ms ease;
        margin: 4px 0 0 0;
      }
      .track-item.active .track-role {
        font-size: 14px;
        color: #fff;
      }
      .track-item.inactive .track-role {
        font-size: 12px;
        color: #6b7280;
      }
      .mute-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999;
        width: 48px;
        height: 48px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: background 0.2s;
      }
      .mute-btn:hover {
        background: rgba(0, 0, 0, 0.75);
      }
      @media (max-width: 768px) {
        .track-list {
          left: 24px;
        }
        .track-item.active .track-title {
          font-size: 16px;
        }
        .track-item.inactive .track-title {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="cover" id="cover" alt="" />
      <img class="cover-overlay" id="cover-overlay" alt="" />
      <div class="scrim"></div>
      <div class="track-list" id="track-list"></div>
      <audio id="audio" preload="auto" muted autoplay></audio>
    </div>

    <button class="mute-btn" id="mute-btn" type="button" aria-label="Toggle sound">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>

    <script>
      (function () {
        var ICON_MUTED =
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
        var ICON_UNMUTED =
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';

        var tracks = [];
        var currentIdx = 0;
        var transitioning = false;
        var coverEl = document.getElementById('cover');
        var coverOverlay = document.getElementById('cover-overlay');
        var listEl = document.getElementById('track-list');
        var audio = document.getElementById('audio');
        var muteBtn = document.getElementById('mute-btn');

        var trackItems = [];

        function buildList() {
          listEl.innerHTML = '';
          trackItems = [];
          tracks.forEach(function (track, idx) {
            var item = document.createElement('div');
            item.className = 'track-item';
            var h2 = document.createElement('h2');
            h2.className = 'track-title';
            h2.textContent = track.title;
            var p = document.createElement('p');
            p.className = 'track-role';
            p.textContent = track.role;
            item.appendChild(h2);
            item.appendChild(p);
            item.addEventListener('click', function () {
              if (idx !== currentIdx) switchTo(idx);
            });
            listEl.appendChild(item);
            trackItems.push(item);
          });
          updateActive();
        }

        function updateActive() {
          trackItems.forEach(function (item, idx) {
            var active = idx === currentIdx;
            item.classList.toggle('active', active);
            item.classList.toggle('inactive', !active);
          });
        }

        function switchTo(idx) {
          if (transitioning) return;
          transitioning = true;
          var prev = tracks[currentIdx];
          currentIdx = idx;
          var next = tracks[idx];

          coverOverlay.src = prev.coverUrl;
          coverOverlay.style.opacity = '1';
          coverEl.src = next.coverUrl;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              coverOverlay.style.opacity = '0';
            });
          });

          var wasMuted = audio.muted;
          audio.src = next.audioUrl;
          audio.muted = wasMuted;
          audio.play().catch(function () {});

          updateActive();
          setTimeout(function () {
            transitioning = false;
          }, 800);
        }

        function init() {
          if (!tracks.length) return;
          var first = tracks[0];
          coverEl.src = first.coverUrl;
          audio.src = first.audioUrl;
          audio.muted = true;
          audio.play().catch(function () {});
          buildList();

          window.addEventListener(
            'wheel',
            function (e) {
              e.preventDefault();
              if (transitioning) return;
              if (e.deltaY > 0 && currentIdx < tracks.length - 1) {
                switchTo(currentIdx + 1);
              } else if (e.deltaY < 0 && currentIdx > 0) {
                switchTo(currentIdx - 1);
              }
            },
            { passive: false }
          );

          var touchY = null;
          window.addEventListener('touchstart', function (e) {
            touchY = e.touches[0].clientY;
          });
          window.addEventListener('touchend', function (e) {
            if (touchY == null) return;
            var dy = touchY - e.changedTouches[0].clientY;
            touchY = null;
            if (Math.abs(dy) < 40) return;
            if (transitioning) return;
            if (dy > 0 && currentIdx < tracks.length - 1)
              switchTo(currentIdx + 1);
            else if (dy < 0 && currentIdx > 0) switchTo(currentIdx - 1);
          });

          function updateBtn() {
            muteBtn.innerHTML = audio.muted ? ICON_MUTED : ICON_UNMUTED;
          }
          updateBtn();
          muteBtn.addEventListener('click', function () {
            audio.muted = !audio.muted;
            if (!audio.muted && audio.paused) {
              audio.play().catch(function () {});
            }
            updateBtn();
          });
        }

        fetch('/data/projects.json')
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            tracks = (data.music || []).slice();
            init();
          })
          .catch(function (e) {
            console.error('Failed to load music data', e);
          });
      })();
    </script>
    <script src="/nav.js" defer></script>
    <script src="/touch-swipe.js" defer></script>
    <script src="/contact-fab.js" defer></script>
  </body>
</html>
