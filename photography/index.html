<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photography — Ralph Daccache</title>
    <meta name="description" content="Photography by Ralph Daccache" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="256x256" type="image/x-icon" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .cover,
      .cover-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover {
        z-index: 0;
      }
      .cover-overlay {
        z-index: 1;
        opacity: 0;
        pointer-events: none;
        transition: opacity 700ms ease;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 2;
        pointer-events: none;
      }
      .track-list {
        position: absolute;
        top: 50%;
        left: 32px;
        transform: translateY(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .track-item {
        cursor: pointer;
        transition: transform 500ms ease, opacity 500ms ease;
        transform-origin: left center;
      }
      .track-item.active {
        opacity: 1;
        transform: scale(1);
      }
      .track-item.inactive {
        opacity: 0.4;
        transform: scale(0.95);
      }
      .track-title {
        font-weight: 700;
        letter-spacing: 0.025em;
        transition: font-size 300ms ease, color 300ms ease;
        margin: 0;
      }
      .track-item.active .track-title {
        font-size: 20px;
        color: #fff;
      }
      .track-item.inactive .track-title {
        font-size: 18px;
        color: #9ca3af;
      }
      .track-role {
        font-weight: 300;
        transition: font-size 300ms ease, color 300ms ease;
        margin: 4px 0 0 0;
      }
      .track-item.active .track-role {
        font-size: 14px;
        color: #fff;
      }
      .track-item.inactive .track-role {
        font-size: 12px;
        color: #6b7280;
      }
      .photo-nav {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 18px;
        z-index: 5000;
      }
      .arrow-btn {
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px) saturate(160%);
        -webkit-backdrop-filter: blur(10px) saturate(160%);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: background 200ms ease, opacity 200ms ease,
          transform 150ms ease;
      }
      .arrow-btn:hover:not(:disabled) {
        background: rgba(0, 0, 0, 0.75);
      }
      .arrow-btn:active:not(:disabled) {
        transform: scale(0.94);
      }
      .arrow-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .photo-counter {
        font-size: 11px;
        letter-spacing: 0.32em;
        color: rgba(255, 255, 255, 0.75);
        font-weight: 300;
        font-variant-numeric: tabular-nums;
        min-width: 64px;
        text-align: center;
      }
      @media (max-width: 768px) {
        .track-list {
          left: 24px;
        }
        .track-item.active .track-title {
          font-size: 16px;
        }
        .track-item.inactive .track-title {
          font-size: 14px;
        }
        .photo-nav {
          bottom: 24px;
          gap: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="cover" id="cover" alt="" />
      <img class="cover-overlay" id="cover-overlay" alt="" />
      <div class="scrim"></div>
      <div class="track-list" id="track-list"></div>
    </div>

    <div class="photo-nav" id="photo-nav">
      <button class="arrow-btn" id="prev-photo" type="button" aria-label="Previous photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="photo-counter" id="photo-counter">01 / 01</span>
      <button class="arrow-btn" id="next-photo" type="button" aria-label="Next photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <script>
      (function () {
        var projects = [];
        var currentProjectIdx = 0;
        var currentPhotoIdx = 0;
        var transitioning = false;

        var coverEl = document.getElementById('cover');
        var coverOverlay = document.getElementById('cover-overlay');
        var listEl = document.getElementById('track-list');
        var counterEl = document.getElementById('photo-counter');
        var prevBtn = document.getElementById('prev-photo');
        var nextBtn = document.getElementById('next-photo');
        var photoNav = document.getElementById('photo-nav');
        var trackItems = [];

        function pad(n) {
          return n < 10 ? '0' + n : String(n);
        }

        function buildList() {
          listEl.innerHTML = '';
          trackItems = [];
          projects.forEach(function (project, idx) {
            var item = document.createElement('div');
            item.className = 'track-item';
            var h2 = document.createElement('h2');
            h2.className = 'track-title';
            h2.textContent = project.title;
            var p = document.createElement('p');
            p.className = 'track-role';
            p.textContent = project.role;
            item.appendChild(h2);
            item.appendChild(p);
            item.addEventListener('click', function () {
              if (idx !== currentProjectIdx) switchProject(idx);
            });
            listEl.appendChild(item);
            trackItems.push(item);
          });
          updateActive();
        }

        function updateActive() {
          trackItems.forEach(function (item, idx) {
            var active = idx === currentProjectIdx;
            item.classList.toggle('active', active);
            item.classList.toggle('inactive', !active);
          });
        }

        function updateNav() {
          var project = projects[currentProjectIdx];
          if (!project) return;
          var total = project.photos.length;
          counterEl.textContent =
            pad(currentPhotoIdx + 1) + ' / ' + pad(total);
          prevBtn.disabled = currentPhotoIdx <= 0;
          nextBtn.disabled = currentPhotoIdx >= total - 1;
          photoNav.style.display = total > 1 ? 'flex' : 'none';
        }

        function preloadProject(idx) {
          var p = projects[idx];
          if (!p) return;
          p.photos.forEach(function (src) {
            var img = new Image();
            img.src = src;
          });
        }

        function crossfade(nextSrc, prevSrc) {
          if (prevSrc) {
            coverOverlay.src = prevSrc;
            coverOverlay.style.opacity = '1';
          }
          coverEl.src = nextSrc;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              coverOverlay.style.opacity = '0';
            });
          });
        }

        function switchProject(idx) {
          if (transitioning || idx === currentProjectIdx) return;
          if (idx < 0 || idx >= projects.length) return;
          transitioning = true;
          var prevSrc = projects[currentProjectIdx].photos[currentPhotoIdx];
          currentProjectIdx = idx;
          currentPhotoIdx = 0;
          var nextSrc = projects[idx].photos[0];
          crossfade(nextSrc, prevSrc);
          preloadProject(idx);
          updateActive();
          updateNav();
          setTimeout(function () {
            transitioning = false;
          }, 700);
        }

        function switchPhoto(direction) {
          if (transitioning) return;
          var project = projects[currentProjectIdx];
          var newIdx = currentPhotoIdx + direction;
          if (newIdx < 0 || newIdx >= project.photos.length) return;
          transitioning = true;
          var prevSrc = project.photos[currentPhotoIdx];
          currentPhotoIdx = newIdx;
          var nextSrc = project.photos[newIdx];
          crossfade(nextSrc, prevSrc);
          updateNav();
          setTimeout(function () {
            transitioning = false;
          }, 500);
        }

        function init() {
          if (!projects.length) return;
          coverEl.src = projects[0].photos[0];
          preloadProject(0);
          buildList();
          updateNav();

          prevBtn.addEventListener('click', function () {
            switchPhoto(-1);
          });
          nextBtn.addEventListener('click', function () {
            switchPhoto(1);
          });

          window.addEventListener(
            'wheel',
            function (e) {
              e.preventDefault();
              if (transitioning) return;
              if (e.deltaY > 0 && currentProjectIdx < projects.length - 1) {
                switchProject(currentProjectIdx + 1);
              } else if (e.deltaY < 0 && currentProjectIdx > 0) {
                switchProject(currentProjectIdx - 1);
              }
            },
            { passive: false }
          );

          window.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') switchPhoto(-1);
            else if (e.key === 'ArrowRight') switchPhoto(1);
            else if (e.key === 'ArrowDown' || e.key === 'PageDown') {
              if (currentProjectIdx < projects.length - 1)
                switchProject(currentProjectIdx + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
              if (currentProjectIdx > 0)
                switchProject(currentProjectIdx - 1);
            }
          });

          var touchY = null;
          window.addEventListener('touchstart', function (e) {
            touchY = e.touches[0].clientY;
          });
          window.addEventListener('touchend', function (e) {
            if (touchY == null) return;
            var dy = touchY - e.changedTouches[0].clientY;
            touchY = null;
            if (Math.abs(dy) < 40) return;
            if (transitioning) return;
            if (dy > 0 && currentProjectIdx < projects.length - 1) {
              switchProject(currentProjectIdx + 1);
            } else if (dy < 0 && currentProjectIdx > 0) {
              switchProject(currentProjectIdx - 1);
            }
          });
        }

        fetch('/data/projects.json')
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            projects = (data.photography || []).slice();
            init();
          })
          .catch(function (e) {
            console.error('Failed to load photography data', e);
          });
      })();
    </script>
    <script src="/nav.js" defer></script>
    <script src="/touch-swipe.js" defer></script>
  </body>
</html>
